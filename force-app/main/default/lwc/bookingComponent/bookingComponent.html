<template>
    <lightning-card title="Create Booking & Payment" icon-name="standard:opportunity">
        <div class="booking-wrapper slds-p-around_medium">

            <!-- ===== PROGRESS INDICATOR ===== -->
            <div class="progress-bar slds-m-bottom_large">
                <div class={step1Class}>
                    <div class="circle">1</div>
                    <span class="step-label">Booking</span>
                </div>
                <div class="connector"></div>
                <div class={step2Class}>
                    <div class="circle">2</div>
                    <span class="step-label">Ownership</span>
                </div>
                <div class="connector"></div>
                <div class={step3Class}>
                    <div class="circle">3</div>
                    <span class="step-label">Payment</span>
                </div>
            </div>

            <!-- ================= STEP 1 : BOOKING ================= -->
            <template if:true={isStep1}>
                <div class="card-section slds-box slds-theme_shade">
                    <h3 class="section-title">Select Inventory</h3>

                    <lightning-combobox
                        class="slds-m-bottom_small"
                        label="Project"
                        value={projectId}
                        options={projectOptions}
                        onchange={handleProjectChange}
                        placeholder="Choose a project"
                        required>
                    </lightning-combobox>

                    <lightning-combobox
                        class="slds-m-bottom_small"
                        label="Property"
                        value={propertyId}
                        options={propertyOptions}
                        onchange={handlePropertyChange}
                        disabled={isPropertyDisabled}
                        placeholder="Choose a property"
                        required>
                    </lightning-combobox>

                    <lightning-combobox
                        label="Unit"
                        value={unitId}
                        options={unitOptions}
                        onchange={handleUnitChange}
                        disabled={isUnitDisabled}
                        placeholder="Choose a unit"
                        required>
                    </lightning-combobox>

                    <!-- Unit summary preview
                    <template if:true={selectedUnitInfo}>
                        <div class="unit-preview slds-m-top_medium">
                            <div class="preview-row">
                                <span class="preview-key">Unit Cost</span>
                                <span class="preview-val">{formattedUnitCost}</span>
                            </div>
                        </div>
                    </template>  -->
                </div>

                <div class="footer-actions slds-m-top_medium">
                    <lightning-button
                        label="Next"
                        variant="brand"
                        icon-name="utility:forward"
                        icon-position="right"
                        onclick={handleNext}>
                    </lightning-button>
                </div>
            </template>

            <!-- ================= STEP 2 : JOINT OWNER ================= -->
            <template if:true={isStep2}>
                <div class="card-section slds-box slds-theme_shade">
                    <div class="joint-owner-header">
                        <h3 class="section-title">Add Joint Owners</h3>
                        <lightning-button
                            label="Add"
                            variant="brand"
                            icon-name="utility:add"
                            onclick={handleAddJointOwner}>
                        </lightning-button>
                    </div>

                    <template if:false={hasJointOwners}>
                        <div class="joint-owner-empty">
                            No joint owners added. Click Add to select an Account.
                        </div>
                    </template>

                    <template for:each={jointOwners} for:item="owner" for:index="index">
                        <div key={owner.id} class="joint-owner-section slds-m-top_medium">
                            <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12">
                                    <lightning-record-picker
                                        label="Account"
                                        placeholder="Search Accounts..."
                                        object-api-name="Account"
                                        value={owner.accountId}
                                        onchange={handleJointOwnerChange}
                                        data-index={index}
                                        data-field="accountId"
                                        required>
                                    </lightning-record-picker>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12">
                                    <lightning-input
                                        type="number"
                                        label="Share %"
                                        value={owner.share}
                                        min="0.01"
                                        max="100"
                                        step="0.01"
                                        onchange={handleJointOwnerChange}
                                        data-index={index}
                                        data-field="share"
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                                    <lightning-input
                                        label="Booking"
                                        value={bookingName}
                                        disabled>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-12 remove-owner">
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Remove joint owner"
                                        title="Remove"
                                        variant="border-filled"
                                        data-id={owner.id}
                                        onclick={handleRemoveJointOwner}>
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="footer-actions slds-m-top_medium">
                    <lightning-button
                        label="Back"
                        variant="neutral"
                        icon-name="utility:back"
                        onclick={handleBack}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button
                        label="Next"
                        variant="brand"
                        icon-name="utility:forward"
                        icon-position="right"
                        onclick={handleNext}>
                    </lightning-button>
                </div>
            </template>

            <!-- ================= STEP 3 : PAYMENT ================= -->
<template if:true={isStep3}>
    <div class="card-section slds-box slds-theme_shade">
        <h3 class="section-title">Payment Details</h3>

        <div class="slds-grid slds-gutters slds-wrap">

            <!-- Payment Mode -->
            <div class="slds-col slds-size_1-of-2">
                <lightning-combobox
                    label="Payment Mode"
                    value={paymentMode}
                    options={paymentModeOptions}
                    onchange={handlePaymentModeChange}
                    placeholder="Select mode"
                    required>
                </lightning-combobox>
            </div>

            <!-- Purpose -->
            <div class="slds-col slds-size_1-of-2">
                <lightning-combobox
                    label="Purpose"
                    value={purpose}
                    options={purposeOptions}
                    onchange={handleFieldChange}
                    data-field="purpose"
                    placeholder="Select purpose">
                </lightning-combobox>
            </div>

            <!-- Amount -->
            <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                <lightning-input
                    type="number"
                    label="Amount"
                    value={amount}
                    onchange={handleFieldChange}
                    data-field="amount"
                    formatter="currency"
                    step="0.01"
                    required>
                </lightning-input>
            </div>

        </div>

        <!-- ===== CHEQUE ONLY ===== -->
        <template if:true={isCheque}>
            <div class="mode-section">

                <div class="mode-badge">
                    Cheque Details
                </div>

                <div class="slds-grid slds-gutters slds-wrap">

                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            label="Cheque Number"
                            data-field="chequeNumber"
                            onchange={handleFieldChange}>
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Bank Name"
                            value={bankName}
                            options={bankNameOptions}
                            data-field="bankName"
                            onchange={handleFieldChange}>
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            label="Branch"
                            data-field="branch"
                            onchange={handleFieldChange}>
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="date"
                            label="Cheque Date"
                            data-field="chequeDate"
                            onchange={handleFieldChange}>
                        </lightning-input>
                    </div>

                </div>

            </div>
        </template>

    </div>

    <div class="footer-actions slds-m-top_medium">
        <lightning-button
            label="Back"
            variant="neutral"
            icon-name="utility:back"
            onclick={handleBack}
            class="slds-m-right_small">
        </lightning-button>

        <lightning-button
            label="Save"
            variant="brand"
            onclick={handleSave}>
        </lightning-button>
    </div>
</template>

            <!-- Spinner -->
            <template if:true={isSaving}>
                <lightning-spinner alternative-text="Processing" size="medium"></lightning-spinner>
            </template>

        </div>
    </lightning-card>
</template>
